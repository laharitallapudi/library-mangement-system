{% extends "base.html" %}{% block title %}New checkout{% endblock %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">OUT IN THE WORLD</div><h1>New checkout</h1><p>Choose a reader and a book to send on its way.</p></div></div>
<form class="form-card" method="post"><div class="form-grid"><label class="wide">Book to borrow <span class="required">*</span><select name="book_id" required><option value="">Select an available book</option>{% for book in books %}<option value="{{ book.id }}">{{ book.title }} · {{ book.author }}</option>{% endfor %}</select>{% if not books %}<small class="field-note">Every book is on loan right now.</small>{% endif %}</label><label class="wide">Member <span class="required">*</span><select name="member_id" required><option value="">Select an active member</option>{% for member in members %}<option value="{{ member.id }}">{{ member.name }}{% if member.email %} · {{ member.email }}{% endif %}</option>{% endfor %}</select>{% if not members %}<small class="field-note">Register an active member to continue.</small>{% endif %}</label><label>Due date <span class="required">*</span><input type="date" name="due_date" min="{{ today }}" value="{{ today }}" required><small class="field-note">The checkout date is recorded as today.</small></label></div><div class="form-actions"><a class="button secondary" href="{{ url_for('loans') }}">Cancel</a><button class="button primary" {% if not books or not members %}disabled{% endif %}>Record checkout</button></div></form>
{% endblock %}
